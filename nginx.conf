server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        auth_basic           "TCM access";
        auth_basic_user_file /etc/nginx/auth/.htpasswd;

        try_files $uri $uri/ /index.html;
    }

    location /css/ {
        try_files $uri $uri/ =404;
    }

    location /js/ {
        try_files $uri $uri/ =404;
    }
}
