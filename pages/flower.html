            text-align: center;

        }
        
        .flower-hero::before {
            content: '';

            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, transparent 70%);
            animation: float 20s ease-in-out infinite;
        }
        
        .flower-hero::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);

<body>
    <div class="header">
        <div class="header-with-back">
            <a href="index.html" class="back-home"><i class="fas fa-chevron-left"></i> 首页</a>

        </div>
        <p id="date-display"></p>
    </div>
    
    <div class="flower-selector">
        <div class="selector-label">选择花卉：</div>
        <div class="flower-tags" id="flower-tags"></div>
    </div>
    
    <div class="plant-selector">
        <div class="selector-label">选择植物：</div>
        <div class="plant-tags" id="plant-tags"></div>
    </div>
    
    <div class="holiday-selector">
        <div class="selector-label">选择节日：</div>
        <div class="holiday-tags" id="holiday-tags"></div>
    </div>
    
    <div id="flower-content"></div>
    
    <div class="container">
        <div class="holiday-guide-section">
            <div class="card">
                <div class="section-title"><i class="fas fa-calendar-alt"></i> 节日送花指南</div>
                <div id="holiday-guide"></div>
            </div>
        </div>
        
        <div class="notice">
            <i class="fas fa-info-circle"></i>
            <strong>温馨提示：</strong>送花时注意花语含义，不同颜色和数量有不同的寓意。选择合适的花卉表达心意。
        </div>
    </div>
    
    <script type="module">
        import { getTodayString, getDayOfYear, onReady } from '../js/common.js';
        import { flowerData } from '../js/flower-data.js';

        let currentFlowerIndex = 0;
        let currentHoliday = null;
        let currentPlant = null;
        let currentPageIndex = 0;
        
        // 处理图片加载错误
        function handleImageError(img, icon, type) {
            img.onerror = null; // 防止无限循环
            const container = img.parentElement;
            if (type === 'hero') {
                container.innerHTML = `<div class="flower-icon">${icon}</div>`;
            } else {
                container.innerHTML = `<div class="flower-grid-icon">${icon}</div>`;
            }
        }
        
        // 使用缓存系统加载图片
        async function loadImageWithCache(imgElement, originalUrl, icon, type) {
            if (!originalUrl || !imgElement) {
                if (imgElement) {
                    handleImageError(imgElement, icon, type);
                }
                return;
            }
            
            // 如果图片已经有 src，说明已经加载过了
            if (imgElement.src && imgElement.src !== '') {
                return;
            }
            
            // 如果是本地图片路径（不以 http 开头），直接使用
            if (!originalUrl.startsWith('http://') && !originalUrl.startsWith('https://')) {
                imgElement.src = originalUrl;
                imgElement.onerror = () => {
                    handleImageError(imgElement, icon, type);
                };
                return;
            }
            
            try {
                // 检查 imageCache 是否已初始化
                if (typeof imageCache === 'undefined' || !imageCache) {
                    // 如果缓存系统未初始化，直接使用原始 URL
                    imgElement.src = originalUrl;
                    imgElement.onerror = () => {
                        handleImageError(imgElement, icon, type);
                    };
                    return;
                }
                
                // 使用缓存系统获取图片
                const cachedUrl = await imageCache.getImage(originalUrl);
                if (cachedUrl) {
                    imgElement.src = cachedUrl;
                    
                    imgElement.onerror = () => {
                        // 如果缓存图片加载失败，尝试使用原始 URL
                        imgElement.src = originalUrl;
                        imgElement.onerror = () => {
                            handleImageError(imgElement, icon, type);
                        };
                    };
                } else {
                    // 如果获取失败，使用原始 URL
                    imgElement.src = originalUrl;
                    imgElement.onerror = () => {
                        handleImageError(imgElement, icon, type);
                    };
                }
            } catch (error) {
                console.error('加载图片失败:', error);
                // 如果缓存系统失败，直接使用原始 URL
                imgElement.src = originalUrl;
                imgElement.onerror = () => {
                    handleImageError(imgElement, icon, type);
                };
            }
        }
        
        // 初始化图片懒加载
        let imageObserver = null;
        function initImageLazyLoad() {
            // 如果观察者已存在，先断开
            if (imageObserver) {
                imageObserver.disconnect();
            }
            
            // 创建新的观察者
            imageObserver = new IntersectionObserver((entries, observer) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const img = entry.target;
                        const dataSrc = img.getAttribute('data-src');
                        const icon = img.getAttribute('data-icon') || '🌺';
                        const type = img.getAttribute('data-type') || 'grid';
                        
                        if (dataSrc && !img.src) {
                            loadImageWithCache(img, dataSrc, icon, type);
                            observer.unobserve(img);
                        }
                    }
                });
            }, {
                rootMargin: '50px' // 提前50px开始加载
            });
            
            // 观察所有带有 data-src 且还没有 src 的图片
            document.querySelectorAll('img[data-src]:not([src])').forEach(img => {
                imageObserver.observe(img);
            });
        }
        
        // 获取花卉图片URL（使用Pixabay API，更可靠）

        // 改进：使用更简单直接的方式获取图片
        function getFlowerImageUrlDirect(nameEn, size = 400) {

        // 根据花卉名称找到花卉数据
        function findFlowerByName(name) {
            // 精确匹配
            let flower = flowerData.find(f => f.name === name);
            if (flower) return flower;
            
            // 处理名称匹配（可能包含"红玫瑰"、"粉玫瑰"等，需要匹配"玫瑰"）
            const baseName = name.replace(/^(红|粉|白|黄|蓝|紫|香槟|彩)/, '');
            flower = flowerData.find(f => f.name === baseName);
            if (flower) return flower;
            
            // 包含匹配
            flower = flowerData.find(f => name.includes(f.name) || f.name.includes(baseName));
            if (flower) return flower;
            
            // 特殊匹配（处理"白菊"匹配"菊花"）
            if (name.includes('菊')) {
                return flowerData.find(f => f.name.includes('菊'));
            }
            
            // 处理"艾草"和"菖蒲"等不在数据库中的花卉
            // 这些会在renderHolidayGuide中处理
            return null;
        }
        
        // 获取适合某个节日的花卉索引列表（包括不在数据库中的花卉）
        function getFlowersForHoliday(holiday) {
            if (!holiday || !holidayFlowerGuide[holiday]) {
                return [];
            }
            const guide = holidayFlowerGuide[holiday];
            const flowerIndices = [];
            
            guide.recommended.forEach((rec, idx) => {
                const flower = findFlowerByName(rec.flower);
                if (flower) {
                    const index = flowerData.indexOf(flower);
                    if (index !== -1 && !flowerIndices.includes(index)) {
                        flowerIndices.push(index);
                    }
                } else {
                    // 不在数据库中的花卉（如艾草、菖蒲），使用负数索引来标记
                    // 使用 -(idx + 1000) 作为特殊标记，实际渲染时会根据原始索引找到对应的rec
                    flowerIndices.push(-(idx + 1000));
                }
            });
            
            return flowerIndices;
        }

                                <div class="holiday-title">${holiday.holiday}</div>
                                <div class="holiday-item">
                                    <div class="holiday-name">推荐：${holiday.recommendation}</div>
                                    <div class="holiday-detail">寓意：${holiday.meaning}</div>
                                    <div class="holiday-detail">颜色：${holiday.color}</div>
                                    <div class="holiday-tips">💡 ${holiday.tips}</div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                    
                    <div class="card">
                        <div class="section-title"><i class="fas fa-seedling"></i> 养护方法</div>
                        <div class="care-grid">
                            <div class="care-item">
                                <div class="care-label">光照</div>
                                <div class="care-value">${flower.care.light}</div>
                            </div>
                            <div class="care-item">
                                <div class="care-label">浇水</div>
                                <div class="care-value">${flower.care.water}</div>
                            </div>
                            <div class="care-item">
                                <div class="care-label">温度</div>
                                <div class="care-value">${flower.care.temperature}</div>
                            </div>
                            ${flower.care.fertilizer ? `
                            <div class="care-item">
                                <div class="care-label">施肥</div>
                                <div class="care-value">${flower.care.fertilizer}</div>
                            </div>
                            ` : ''}
                        </div>
                        <div class="care-tips">
                            <strong>💡 养护小贴士：</strong>${flower.care.tips}
                        </div>
                    </div>
                    
                    <div class="card">
                        <div class="section-title"><i class="fas fa-info-circle"></i> 其他信息</div>
                        <div class="info-row">
                            <span class="label">花期/季节</span>
                            <span class="value">${flower.season}</span>
                        </div>
                        <div class="info-row">
                            <span class="label">价格参考</span>
                            <span class="value">${flower.price}</span>
                        </div>
                        <div class="info-row">
                            <span class="label">主要颜色</span>
                            <span class="value">
                                <div class="color-tags">
                                    ${flower.color.map(c => `<span class="color-tag">${c}</span>`).join('')}
                                </div>
                            </span>
                        </div>
                        <div class="info-row">
                            <span class="label">原产地</span>
                            <span class="value">${flower.origin}</span>
                        </div>
                        ${flower.tips ? `
                        <div class="info-row">
                            <span class="label">送花小贴士</span>
                            <span class="value" style="font-size: 12px; text-align: right;">${flower.tips}</span>
                        </div>
                        ` : ''}
                    </div>
                </div>
            `;
            
            // 初始化图片懒加载（hero图片立即加载）
            setTimeout(() => {
                const heroImg = container.querySelector('img[data-src]');
                if (heroImg) {
                    const dataSrc = heroImg.getAttribute('data-src');
                    const icon = heroImg.getAttribute('data-icon') || '🌺';
                    const type = heroImg.getAttribute('data-type') || 'hero';
                    loadImageWithCache(heroImg, dataSrc, icon, type);
                }
            }, 50);
        }
        
        function renderHolidayGuide() {
            const container = document.getElementById('holiday-guide');
            const holidays = Object.keys(holidayFlowerGuide);
            
            // 如果选择了特定节日，显示该节日的花卉列表；否则显示全部节日指南
            if (currentHoliday) {
                const guide = holidayFlowerGuide[currentHoliday];
                if (!guide) {
                    container.innerHTML = '<div class="guide-holiday"><div class="guide-holiday-title">暂无数据</div></div>';
                    return;
                }
                
                // 不再在这里显示列表，因为已经在renderFlower中显示两列了
                const flowerList = '';
                
                container.innerHTML = `
                    <div class="guide-holiday">
                        <div class="guide-holiday-title">${currentHoliday}</div>
                        <div class="guide-holiday-date">📅 ${guide.date}</div>
                        <div class="guide-tips">
                            💡 ${guide.tips}
                        </div>
                        ${guide.color ? `<div class="guide-tips" style="margin-top: 8px;">🎨 推荐颜色：${guide.color}</div>` : ''}
                    </div>
                `;
            } else {
                // 显示全部节日指南
                const displayHolidays = holidays;
                
                if (displayHolidays.length === 0) {
                    container.innerHTML = '<div class="guide-holiday"><div class="guide-holiday-title">暂无数据</div></div>';
                    return;
                }
                
                container.innerHTML = displayHolidays.map(holiday => {
                    const guide = holidayFlowerGuide[holiday];
                    return `
                        <div class="guide-holiday">
                            <div class="guide-holiday-title">${holiday}</div>
                            <div class="guide-holiday-date">📅 ${guide.date}</div>
                            <div class="guide-recommendation">
                                ${guide.recommended.map(rec => `
                                    <div class="guide-flower-item">
                                        <strong>${rec.flower}</strong> ${rec.count} - ${rec.meaning}
                                    </div>
                                `).join('')}
                            </div>
                            <div class="guide-tips">
                                💡 ${guide.tips}
                            </div>
                            ${guide.color ? `<div class="guide-tips" style="margin-top: 8px;">🎨 推荐颜色：${guide.color}</div>` : ''}
                        </div>
                    `;
                }).join('');
            }
        }
        
        function setupEventDelegation() {
            document.getElementById('flower-tags').addEventListener('click', (e) => {
                const tag = e.target.closest('[data-flower-index]');
                if (tag) switchFlower(parseInt(tag.dataset.flowerIndex));
            });
            document.getElementById('holiday-tags').addEventListener('click', (e) => {
                const tag = e.target.closest('[data-holiday]');
                if (tag) switchHoliday(tag.dataset.holiday || null);
            });
            const plantTags = document.getElementById('plant-tags');
            if (plantTags) {
                plantTags.addEventListener('click', (e) => {
                    const tag = e.target.closest('[data-plant]');
                    if (tag) switchPlant(tag.dataset.plant || null);
                });
            }
            document.getElementById('flower-content').addEventListener('click', (e) => {
                const plantItem = e.target.closest('[data-plant-name]');
                if (plantItem) { switchPlant(plantItem.dataset.plantName); return; }
                const flowerItem = e.target.closest('[data-flower-index]');
                if (flowerItem) { switchFlower(parseInt(flowerItem.dataset.flowerIndex)); return; }
                if (e.target.closest('#prev-flower-page')) prevFlowerPage();
                if (e.target.closest('#next-flower-page')) nextFlowerPage();
            });
        }

        onReady(() => {
            init();
            setupEventDelegation();
        });
    </script>
</body>
</html>
